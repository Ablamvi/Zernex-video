name: ZERNEX Video - Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  release:
    name: Build and verify signed APK
    runs-on: ubuntu-24.04

    env:
      KEYSTORE_FILE: ${{ github.workspace }}/hugues-release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ZERNEX_KEYSTORE_FILE: ${{ github.workspace }}/hugues-release.keystore
      ZERNEX_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ZERNEX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ZERNEX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not configured"; exit 1; }

          SDKMANAGER="$(command -v sdkmanager || true)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          SDK_LOG="$RUNNER_TEMP/android-sdk-install.log"

          if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install               "platforms;android-37"               "build-tools;36.0.0"               >"$SDK_LOG" 2>&1; then
            if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install                 "platforms;android-37.0"                 "build-tools;36.0.0"                 >>"$SDK_LOG" 2>&1; then
              echo "::error::Android SDK component installation failed"
              tail -n 120 "$SDK_LOG" || true
              exit 1
            fi
          fi

          if [ ! -f "$SDK_ROOT/platforms/android-37/android.jar" ] &&              [ -f "$SDK_ROOT/platforms/android-37.0/android.jar" ]; then
            ln -sfn "android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          test -f "$SDK_ROOT/platforms/android-37/android.jar" || {
            echo "::error::Android API 37 platform is not available"; exit 1;
          }
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner" || {
            echo "::error::Android Build Tools 36.0.0 were not installed"; exit 1;
          }
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2" || {
            echo "::error::aapt2 is missing from Build Tools 36.0.0"; exit 1;
          }


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version | sed -n '1,12p'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "Android platform: API 37"
          echo "Build tools: 36.0.0"

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --warning-mode=none clean -q

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --warning-mode=none :app:assembleRelease -q

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(
            find app/build/outputs/apk -type f -name '*.apk' | sort
          )
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            test -s "$apk"
          done

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          while IFS= read -r apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" >/dev/null
          done < <(find app/build/outputs/apk -type f -name '*.apk' | sort)

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: ZERNEX-Video-V2.3.1-ARMv7-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_FILE"
